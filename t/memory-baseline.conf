worker_processes 2;
master_process on;
daemon on;

pid logs/nginx.pid;
error_log logs/error.log crit;

events {
    worker_connections 1024;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:18081;

        location = /health {
            content_by_lua_block {
                ngx.exit(204)
            }
        }
    }
}

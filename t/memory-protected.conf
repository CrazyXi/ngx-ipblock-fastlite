worker_processes 2;
master_process on;
daemon on;

pid logs/nginx.pid;
error_log logs/error.log crit;

env TEST_NGINX_IPBLOCK_LUA;
env TEST_NGINX_IPBLOCK_BIN;

events {
    worker_connections 1024;
}

http {
    access_log off;

    init_by_lua_block {
        local lua_dir = assert(os.getenv("TEST_NGINX_IPBLOCK_LUA"))
        package.path = lua_dir .. "/?.lua;" .. package.path

        require("ip_blacklist").init({
            path = assert(os.getenv("TEST_NGINX_IPBLOCK_BIN")),
            default_site = {
                enabled = true,
                log_hits = false,
            },
        })
    }

    server {
        listen 127.0.0.1:18081;

        location = /health {
            access_by_lua_block {
                require("ip_blacklist").access()
            }

            content_by_lua_block {
                ngx.exit(204)
            }
        }
    }
}
